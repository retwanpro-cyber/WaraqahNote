name: Build Windows MSIX for Microsoft Store

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build MSIX Package
        run: npm run build:msix

      - name: Upload Store Package
        uses: actions/upload-artifact@v4
        with:
          name: WaraqahNote-Store-Package
          path: dist-electron/*.appx
